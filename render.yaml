services:
  - type: web
    name: trainer-ai-bot
    runtime: docker
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: DATABASE_URL
        fromDatabase:
          name: trainer-ai-db
          property: connectionString

databases:
  - name: trainer-ai-db
    plan: basic-256mb
